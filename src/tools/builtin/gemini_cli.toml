[tool]
name = "gemini_cli"
display_name = "Gemini CLI"
version = "1.0"
# Gemini CLI keeps no verified path-bearing file inside the project, so there
# is nothing to rewrite on a move; `notify` says so instead of claiming a
# rewrite that would be a no-op.
on_move = "notify"
binary = "gemini"

session_patterns = [
  ".gemini/",
  ".geminiignore",
  "GEMINI.md",
]
